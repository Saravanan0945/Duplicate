<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - Your Cart</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Header with Navigation -->
    <header class="header">
        <div class="container">
            <div class="nav-wrapper">
                <h1 class="logo">ShopCart</h1>
                <nav class="nav-menu">
                    <a href="index.html" class="nav-link">Products</a>
                    <a href="cart.html" class="nav-link active">Cart</a>
                </nav>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content cart-page">
        <div class="container">
            <h2 class="page-title">Shopping Cart</h2>

            <!-- Empty Cart Message -->
            <div id="emptyCartMessage" class="empty-cart-message">
                <svg class="empty-cart-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="9" cy="21" r="1"></circle>
                    <circle cx="20" cy="21" r="1"></circle>
                    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                </svg>
                <h3>Your cart is empty</h3>
                <p>Add some products to get started!</p>
                <a href="index.html" class="continue-shopping-btn">Continue Shopping</a>
            </div>

            <!-- Cart Content -->
            <div id="cartContent" class="cart-content">
                <div class="cart-items-section">
                    <div class="cart-items" id="cartItems">
                        <!-- Cart items will be dynamically inserted here -->
                    </div>
                </div>

                <!-- Cart Summary -->
                <aside class="cart-summary">
                    <h3>Order Summary</h3>
                    <div class="summary-row">
                        <span>Subtotal:</span>
                        <span id="subtotalAmount">$0.00</span>
                    </div>
                    <div class="summary-row">
                        <span>Tax (10%):</span>
                        <span id="taxAmount">$0.00</span>
                    </div>
                    <div class="summary-row total-row">
                        <span>Total:</span>
                        <span id="totalAmount">$0.00</span>
                    </div>
                    <button class="checkout-btn" id="checkoutBtn">
                        Proceed to Checkout
                    </button>
                    <a href="index.html" class="continue-shopping-link">Continue Shopping</a>
                </aside>
            </div>
        </div>
    </main>

    <!-- Toast Notification -->
    <div id="toast" class="toast" role="alert" aria-live="polite"></div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 ShopCart. All rights reserved.</p>
        </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
