<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Runner - Go to Cart Functionality</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 20px;
      min-height: 100vh;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 40px;
      text-align: center;
    }

    .header h1 {
      font-size: 36px;
      margin-bottom: 10px;
    }

    .header p {
      font-size: 18px;
      opacity: 0.9;
    }

    .content {
      padding: 40px;
    }

    .test-suite-selector {
      margin-bottom: 30px;
      padding: 20px;
      background: #f9f9f9;
      border-radius: 8px;
    }

    .test-suite-selector h2 {
      font-size: 24px;
      color: #333;
      margin-bottom: 20px;
    }

    .checkbox-group {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
    }

    .checkbox-item {
      display: flex;
      align-items: center;
      padding: 10px;
      background: white;
      border: 2px solid #e0e0e0;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .checkbox-item:hover {
      border-color: #667eea;
      box-shadow: 0 2px 8px rgba(102, 126, 234, 0.2);
    }

    .checkbox-item input[type="checkbox"] {
      width: 20px;
      height: 20px;
      margin-right: 10px;
      cursor: pointer;
    }

    .checkbox-item label {
      cursor: pointer;
      font-size: 16px;
      color: #333;
    }

    .controls {
      display: flex;
      gap: 15px;
      margin-bottom: 30px;
    }

    .btn {
      padding: 15px 30px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    }

    .btn-secondary {
      background: #f0f0f0;
      color: #333;
    }

    .btn-secondary:hover {
      background: #e0e0e0;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .progress-section {
      display: none;
      margin-bottom: 30px;
      padding: 20px;
      background: #f9f9f9;
      border-radius: 8px;
    }

    .progress-section.active {
      display: block;
    }

    .progress-bar-container {
      width: 100%;
      height: 30px;
      background: #e0e0e0;
      border-radius: 15px;
      overflow: hidden;
      margin-bottom: 15px;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #4CAF50 0%, #45a049 100%);
      width: 0%;
      transition: width 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
    }

    .progress-text {
      text-align: center;
      font-size: 16px;
      color: #666;
    }

    .results-section {
      display: none;
    }

    .results-section.active {
      display: block;
    }

    .summary-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .summary-card {
      padding: 20px;
      border-radius: 8px;
      color: white;
      text-align: center;
    }

    .summary-card.total {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    .summary-card.passed {
      background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
    }

    .summary-card.failed {
      background: linear-gradient(135deg, #f44336 0%, #da190b 100%);
    }

    .summary-card.skipped {
      background: linear-gradient(135deg, #ff9800 0%, #f57c00 100%);
    }

    .summary-card h3 {
      font-size: 14px;
      text-transform: uppercase;
      opacity: 0.9;
      margin-bottom: 10px;
    }

    .summary-card .value {
      font-size: 36px;
      font-weight: bold;
    }

    .test-results {
      margin-top: 30px;
    }

    .test-suite-result {
      margin-bottom: 20px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      overflow: hidden;
    }

    .test-suite-result.passed {
      border-left: 6px solid #4CAF50;
    }

    .test-suite-result.failed {
      border-left: 6px solid #f44336;
    }

    .test-suite-header {
      padding: 15px 20px;
      background: #f9f9f9;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .test-suite-header:hover {
      background: #f0f0f0;
    }

    .test-suite-name {
      font-size: 18px;
      font-weight: bold;
      color: #333;
    }

    .test-suite-stats {
      font-size: 14px;
      color: #666;
    }

    .test-suite-body {
      padding: 20px;
      display: none;
      background: white;
    }

    .test-suite-body.active {
      display: block;
    }

    .test-case {
      padding: 10px;
      margin: 5px 0;
      border-left: 4px solid #ddd;
      background: #f9f9f9;
      border-radius: 4px;
    }

    .test-case.passed {
      border-left-color: #4CAF50;
    }

    .test-case.failed {
      border-left-color: #f44336;
      background: #ffebee;
    }

    .console-output {
      margin-top: 30px;
      padding: 20px;
      background: #1e1e1e;
      color: #00ff00;
      border-radius: 8px;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      max-height: 400px;
      overflow-y: auto;
    }

    .console-output .log-entry {
      margin: 5px 0;
      padding: 5px;
    }

    .console-output .log-entry.error {
      color: #ff6b6b;
    }

    .console-output .log-entry.success {
      color: #51cf66;
    }

    .console-output .log-entry.info {
      color: #74c0fc;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🧪 Test Runner</h1>
      <p>Go to Cart Functionality - Interactive Test Execution</p>
      <p style="font-size: 14px; margin-top: 10px; opacity: 0.8;">50+ Test Artifacts | 800+ Test Cases</p>
    </div>

    <div class="content">
      <!-- Test Suite Selector -->
      <div class="test-suite-selector">
        <h2>Select Test Suites to Run</h2>
        <div class="checkbox-group">
          <div class="checkbox-item">
            <input type="checkbox" id="suite-positive" checked>
            <label for="suite-positive">Positive Tests (145)</label>
          </div>
          <div class="checkbox-item">
            <input type="checkbox" id="suite-negative" checked>
            <label for="suite-negative">Negative Tests (168)</label>
          </div>
          <div class="checkbox-item">
            <input type="checkbox" id="suite-security" checked>
            <label for="suite-security">Security Tests (185)</label>
          </div>
          <div class="checkbox-item">
            <input type="checkbox" id="suite-boundary" checked>
            <label for="suite-boundary">Boundary Tests (150)</label>
          </div>
          <div class="checkbox-item">
            <input type="checkbox" id="suite-integration">
            <label for="suite-integration">Integration Tests (46)</label>
          </div>
          <div class="checkbox-item">
            <input type="checkbox" id="suite-e2e">
            <label for="suite-e2e">E2E Tests (31)</label>
          </div>
          <div class="checkbox-item">
            <input type="checkbox" id="suite-performance">
            <label for="suite-performance">Performance Tests (32)</label>
          </div>
          <div class="checkbox-item">
            <input type="checkbox" id="suite-accessibility">
            <label for="suite-accessibility">Accessibility Tests (44)</label>
          </div>
        </div>
      </div>

      <!-- Controls -->
      <div class="controls">
        <button class="btn btn-primary" id="run-tests-btn">
          ▶️ Run Selected Tests
        </button>
        <button class="btn btn-secondary" id="stop-tests-btn" disabled>
          ⏹️ Stop Tests
        </button>
        <button class="btn btn-secondary" id="clear-results-btn">
          🗑️ Clear Results
        </button>
      </div>

      <!-- Progress Section -->
      <div class="progress-section" id="progress-section">
        <div class="progress-bar-container">
          <div class="progress-bar" id="progress-bar">0%</div>
        </div>
        <div class="progress-text" id="progress-text">
          Initializing tests...
        </div>
      </div>

      <!-- Results Section -->
      <div class="results-section" id="results-section">
        <h2 style="font-size: 28px; color: #333; margin-bottom: 20px;">Test Results</h2>
        
        <div class="summary-cards">
          <div class="summary-card total">
            <h3>Total Tests</h3>
            <div class="value" id="total-tests">0</div>
          </div>
          <div class="summary-card passed">
            <h3>Passed</h3>
            <div class="value" id="passed-tests">0</div>
          </div>
          <div class="summary-card failed">
            <h3>Failed</h3>
            <div class="value" id="failed-tests">0</div>
          </div>
          <div class="summary-card skipped">
            <h3>Skipped</h3>
            <div class="value" id="skipped-tests">0</div>
          </div>
        </div>

        <div class="test-results" id="test-results"></div>
      </div>

      <!-- Console Output -->
      <div class="console-output" id="console-output">
        <div class="log-entry info">Console output will appear here...</div>
      </div>
    </div>
  </div>

  <script>
    // Test Runner Logic
    const testRunner = {
      isRunning: false,
      results: {
        total: 0,
        passed: 0,
        failed: 0,
        skipped: 0,
        suites: []
      },

      init() {
        this.bindEvents();
        this.log('Test runner initialized', 'info');
      },

      bindEvents() {
        document.getElementById('run-tests-btn').addEventListener('click', () => this.runTests());
        document.getElementById('stop-tests-btn').addEventListener('click', () => this.stopTests());
        document.getElementById('clear-results-btn').addEventListener('click', () => this.clearResults());
      },

      async runTests() {
        if (this.isRunning) return;

        this.isRunning = true;
        document.getElementById('run-tests-btn').disabled = true;
        document.getElementById('stop-tests-btn').disabled = false;

        // Get selected suites
        const selectedSuites = this.getSelectedSuites();
        
        if (selectedSuites.length === 0) {
          this.log('No test suites selected', 'error');
          this.isRunning = false;
          document.getElementById('run-tests-btn').disabled = false;
          document.getElementById('stop-tests-btn').disabled = true;
          return;
        }

        this.log(`Running ${selectedSuites.length} test suite(s)...`, 'success');
        
        // Show progress section
        document.getElementById('progress-section').classList.add('active');
        document.getElementById('results-section').classList.remove('active');

        // Reset results
        this.results = {
          total: 0,
          passed: 0,
          failed: 0,
          skipped: 0,
          suites: []
        };

        // Simulate test execution (in real implementation, this would call actual test runners)
        for (let i = 0; i < selectedSuites.length; i++) {
          if (!this.isRunning) break;

          const suite = selectedSuites[i];
          this.updateProgress((i / selectedSuites.length) * 100, `Running ${suite.name}...`);
          
          await this.runTestSuite(suite);
          
          this.log(`Completed ${suite.name}`, 'success');
        }

        this.updateProgress(100, 'All tests completed!');
        
        // Show results
        setTimeout(() => {
          document.getElementById('progress-section').classList.remove('active');
          document.getElementById('results-section').classList.add('active');
          this.displayResults();
        }, 1000);

        this.isRunning = false;
        document.getElementById('run-tests-btn').disabled = false;
        document.getElementById('stop-tests-btn').disabled = true;
      },

      async runTestSuite(suite) {
        // Simulate test execution
        await new Promise(resolve => setTimeout(resolve, 2000));

        const suiteResult = {
          name: suite.name,
          total: suite.count,
          passed: Math.floor(suite.count * 0.9), // 90% pass rate simulation
          failed: Math.floor(suite.count * 0.08), // 8% fail rate
          skipped: Math.floor(suite.count * 0.02), // 2% skip rate
          tests: []
        };

        // Generate mock test results
        for (let i = 0; i < suite.count; i++) {
          const rand = Math.random();
          const status = rand > 0.1 ? 'passed' : (rand > 0.02 ? 'failed' : 'skipped');
          
          suiteResult.tests.push({
            name: `Test Case ${i + 1}`,
            status: status,
            duration: Math.floor(Math.random() * 1000) + 100
          });
        }

        this.results.total += suiteResult.total;
        this.results.passed += suiteResult.passed;
        this.results.failed += suiteResult.failed;
        this.results.skipped += suiteResult.skipped;
        this.results.suites.push(suiteResult);
      },

      getSelectedSuites() {
        const suites = [
          { id: 'positive', name: 'Positive Tests', count: 145 },
          { id: 'negative', name: 'Negative Tests', count: 168 },
          { id: 'security', name: 'Security Tests', count: 185 },
          { id: 'boundary', name: 'Boundary Tests', count: 150 },
          { id: 'integration', name: 'Integration Tests', count: 46 },
          { id: 'e2e', name: 'E2E Tests', count: 31 },
          { id: 'performance', name: 'Performance Tests', count: 32 },
          { id: 'accessibility', name: 'Accessibility Tests', count: 44 }
        ];

        return suites.filter(suite => 
          document.getElementById(`suite-${suite.id}`).checked
        );
      },

      updateProgress(percentage, text) {
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');
        
        progressBar.style.width = `${percentage}%`;
        progressBar.textContent = `${Math.round(percentage)}%`;
        progressText.textContent = text;
      },

      displayResults() {
        // Update summary cards
        document.getElementById('total-tests').textContent = this.results.total;
        document.getElementById('passed-tests').textContent = this.results.passed;
        document.getElementById('failed-tests').textContent = this.results.failed;
        document.getElementById('skipped-tests').textContent = this.results.skipped;

        // Display suite results
        const resultsContainer = document.getElementById('test-results');
        resultsContainer.innerHTML = '';

        this.results.suites.forEach((suite, index) => {
          const suiteDiv = document.createElement('div');
          suiteDiv.className = `test-suite-result ${suite.failed === 0 ? 'passed' : 'failed'}`;
          
          suiteDiv.innerHTML = `
            <div class="test-suite-header" onclick="document.getElementById('suite-body-${index}').classList.toggle('active')">
              <div class="test-suite-name">${suite.failed === 0 ? '✅' : '❌'} ${suite.name}</div>
              <div class="test-suite-stats">
                Total: ${suite.total} | Passed: ${suite.passed} | Failed: ${suite.failed} | Skipped: ${suite.skipped}
              </div>
            </div>
            <div class="test-suite-body" id="suite-body-${index}">
              ${suite.tests.map(test => `
                <div class="test-case ${test.status}">
                  <strong>${test.status === 'passed' ? '✅' : test.status === 'failed' ? '❌' : '⏭️'} ${test.name}</strong>
                  <span style="float: right; color: #666; font-size: 12px;">Duration: ${test.duration}ms</span>
                </div>
              `).join('')}
            </div>
          `;

          resultsContainer.appendChild(suiteDiv);
        });

        this.log('Results displayed successfully', 'success');
      },

      stopTests() {
        this.isRunning = false;
        this.log('Test execution stopped by user', 'error');
      },

      clearResults() {
        document.getElementById('results-section').classList.remove('active');
        document.getElementById('progress-section').classList.remove('active');
        document.getElementById('console-output').innerHTML = '<div class="log-entry info">Console cleared</div>';
        this.log('Results cleared', 'info');
      },

      log(message, type = 'info') {
        const consoleOutput = document.getElementById('console-output');
        const logEntry = document.createElement('div');
        logEntry.className = `log-entry ${type}`;
        logEntry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
        consoleOutput.appendChild(logEntry);
        consoleOutput.scrollTop = consoleOutput.scrollHeight;
      }
    };

    // Initialize test runner
    testRunner.init();
  </script>
</body>
</html>
